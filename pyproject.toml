[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepbioparts"
version = "0.1.0"
description = "Deep learning framework for computational synthetic biology - DNA sequence design and prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Yanbing Leng"}
]
keywords = [
    "synthetic-biology",
    "bioinformatics",
    "deep-learning",
    "sequence-design",
    "promoter",
    "diffusion-model",
    "DNA-foundation-model"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "torch>=1.10.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "pyyaml>=5.4.0",
    "biopython>=1.79",
    "sharedb>=1.1.4",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

diffusion = [
    "einops>=0.4.0",
    "ema-pytorch>=0.2.0",
]

visualization = [
    "plotly>=5.0.0",
    "kaleido>=0.2.0",
]

evo = [
    "flash-attn>=2.0.0",
    "transformers>=4.20.0",
]

all = [
    "deepbioparts[dev,diffusion,visualization]",
]

[project.urls]
Homepage = "https://github.com/YanbingLeng/DeepBioParts"
Documentation = "https://github.com/YanbingLeng/DeepBioParts#readme"
Repository = "https://github.com/YanbingLeng/DeepBioParts.git"
Issues = "https://github.com/YanbingLeng/DeepBioParts/issues"

# NOTE: entry-point scripts are run directly from the repo root (`python scripts/<name>.py`).
# No pip-installed console-scripts are provided (scripts/ is not a package;
# the evaluate_*/run_advanced modules no longer exist).
# Available entry points: scripts/{train_predictor, train_ddpm, predict, design_iterative_library}.py

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = [
    "tests*",
    "docs*",
    "examples*",
]

[tool.setuptools.package-data]
"*" = [
    "configs/**/*.yaml",
    "configs/**/*.yml",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
