# Terminator-specific configuration overrides
biopart: terminator

# Activity transform formula
# Note: terminator was trained with a log10(label+1) label transform,
# so apply the inverse 10^pred - 1 before linear calibration.
activity_transform:
  slope: 0.9039
  intercept: 9.6226
  inverse_log10: true
  formula: "true_activity = 0.9039 * (10^pred - 1) + 9.6226"

# Default predictor for quick-predict mode
default_predictor: "./predictor_checkpoints/supervised_model/terminator_CNN_Attn_BiLSTM"

# Strong-terminator classification model (ORNet head on the same CNN-Attn-BiLSTM backbone)
# used by joint scan to predict strong-terminator probability instead of a regression activity.
classification_predictor: "./predictor_checkpoints/supervised_model/terminator_CNN_Attn_BiLSTM_cla"

# Predictor configuration
predictors:
  # CNN–Attention–BiLSTM model
  dl_model:
    predictor_dir: "./predictor_checkpoints/supervised_model/terminator_CNN_Attn_BiLSTM"
    model_type: "conv"
    encoding: "onehot"
    enabled: true
    weight: 0.5  # Ensemble weight

  # Evo model
  evo_model:
    predictor_dir: "./predictor_checkpoints/language_model/terminator_LoRA_finetune"
    model_type: "evo"
    enabled: true
    weight: 0.5  # Ensemble weight
    # Evo-specific parameters
    model_name: "evo-1.5-8k-base"
    lora_rank: 16
    single_model: false  # Use cross-validation models

# Diffusion model configuration (direct one-hot DDPM; trained by scripts/train_ddpm.py)
diffusion:
  checkpoint_path: "./diffusion_checkpoints/terminator_direct/checkpoints/best.pth"
  checkpoint_path_latest: "./diffusion_checkpoints/terminator_direct/checkpoints/latest.pth"

sequence:
  seq_len: 50
  encoding: "onehot"

model:
  architecture: "conv"
  conv_width_motif: 5
  n_heads: 16
  conv_hidden: 128
  motif_conv_hidden: 256
  dropout_rate: 0.2

training:
  batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  patience: 100
