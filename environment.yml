name: deepbioparts
# DeepBioParts — unified Python 3.10 environment (non-Evo + Evo stack).
#
# Create + activate:
#   conda env create -f environment.yml
#   conda activate deepbioparts
# Then install flash-attn from its prebuilt cu12 wheel (see requirements.txt / README) —
# it cannot be built from source without the full CUDA toolkit.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # ---- Core scientific ----
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - numba==0.66.0
      - networkx==3.4.2
      - h5py==3.16.0
      # ---- Deep learning ----
      - torch==2.7.1
      - torchvision==0.22.1
      - triton==3.3.1
      - einops==0.8.2
      - safetensors==0.8.0
      - transformers==5.14.1
      - tokenizers==0.22.2
      - huggingface-hub==1.24.0
      # ---- Evo 1.5 / StripedHyena stack (requires flash-attn, installed separately) ----
      - stripedhyena==0.2.2
      - evo-model==0.4
      - axial-positional-embedding==0.3.12
      - CoLT5-attention==0.11.1
      - linear-attention-transformer==0.19.1
      - linformer==0.2.3
      - local-attention==1.11.2
      - product-key-memory==0.3.0
      # ---- Bioinformatics ----
      - biopython==1.87
      - ShareDB==2.0.2
      -       - Levenshtein==0.27.3
      - RapidFuzz==3.14.5
      - umap-learn==0.5.12
      # ---- Visualization ----
      - matplotlib==3.10.9
      - seaborn==0.13.2
      - logomaker==0.8.7
      - weblogo==3.9.0
      - seqlogo==5.29.11
      - plotly==6.9.0
      - kaleido==1.3.0
      - resvg-py==0.3.3
      - Pillow==12.3.0
      # ---- Experiment tracking / hyperparameter optimization ----
      -       -       # ---- Utilities ----
      - PyYAML==6.0.3
      - tqdm==4.69.0
      - ninja==1.13.0
      # ---- flash-attn 2.7.4.post1 (cu12, cp310, CXX11-ABI TRUE): install separately ----
      # See README "Installation" for the prebuilt-wheel command; do NOT add it here,
      # as `pip install flash-attn` builds from source and needs the CUDA toolkit.
